server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # usuarios-service: login, registro y CRUD de usuarios
    location ~ ^/api/(auth|usuarios)(/|$) {
        proxy_pass http://usuarios-service:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # pedidos-service: productos, categorías, pedidos y reportes
    location /api/ {
        proxy_pass http://pedidos-service:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SPA: cualquier otra ruta (/admin, /catalogo...) la resuelve React Router.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
