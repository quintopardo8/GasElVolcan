# Frontend de Gas El Volcán (React compilado + nginx).
#   docker compose up -d --build   → http://localhost:8080
# nginx reenvía /api/... al backend (repositorio gaselvolcan-backend).
# Local: el backend corre en la misma PC → host.docker.internal.
# AWS:   en .env pon la IP PRIVADA de la EC2 del backend (ver .env.example).
name: gas-el-volcan-frontend

services:
  frontend:
    build: .
    restart: unless-stopped
    environment:
      USUARIOS_API: ${USUARIOS_API:-http://host.docker.internal:8081}
      PEDIDOS_API: ${PEDIDOS_API:-http://host.docker.internal:8082}
    extra_hosts:
      # En Linux (EC2) host.docker.internal no existe por defecto.
      - "host.docker.internal:host-gateway"
    ports:
      - "${FRONTEND_PORT:-8080}:80"
