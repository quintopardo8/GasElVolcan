# ---------- usuarios-service ----------
# Todos los valores se pueden sobrescribir con variables de entorno (ver docker-compose.yml y .env.example).
spring.application.name=usuarios-service
server.port=${PORT:8081}

# Base de datos propia de este microservicio
# Fuera de Docker se conecta al puerto 5433 que publica docker-compose; dentro de Docker DB_PORT=5432.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:gas_usuarios}
spring.datasource.username=${DB_USER:volcan}
spring.datasource.password=${DB_PASSWORD:volcan123}

# Hibernate crea/actualiza las tablas a partir de las entidades.
# Los usuarios están en la base de datos: se desactiva el usuario en memoria que Spring crea por defecto.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Seguridad (JWT). El secreto debe ser el MISMO en pedidos-service y tener 32+ caracteres.
app.jwt.secreto=${JWT_SECRET:desarrollo-cambia-este-secreto-por-uno-largo-y-aleatorio}
app.jwt.minutos=${JWT_MINUTOS:480}

# Orígenes permitidos (solo hace falta si el frontend llama directo al puerto 8081).
app.cors.origenes=${CORS_ORIGENES:http://localhost:5173}

# Administrador inicial y datos de prueba
app.admin.correo=${ADMIN_CORREO:admin@elvolcan.cl}
app.admin.contrasena=${ADMIN_CONTRASENA:Admin1234}
app.admin.nombre=${ADMIN_NOMBRE:Administradora}
app.datos-demo=${DATOS_DEMO:true}

# Swagger UI (http://<host>:<puerto>/swagger-ui.html) y especificación OpenAPI (/v3/api-docs)
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.persist-authorization=true
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method
